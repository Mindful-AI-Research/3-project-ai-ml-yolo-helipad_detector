# Forces a dark theme regardless of the visitor's OS/browser color-scheme
# preference. Without this, Streamlit auto-detects light/dark from the
# browser, which caused native widgets (sidebar radio, selectbox, slider)
# to render in light mode on some browsers (e.g. Chrome with a light OS
# preference) while the dashboard's own custom-styled HTML stayed dark —
# a broken, washed-out mix. This makes the whole app consistently dark on
# every browser and every visitor, matching the project's visual identity.
[theme]
base = "dark"
primaryColor = "#14b8a6"
backgroundColor = "#05070a"
secondaryBackgroundColor = "#0e1117"
textColor = "#e8f0f2"
font = "sans serif"
