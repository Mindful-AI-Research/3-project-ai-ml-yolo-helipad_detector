  .note { position:fixed; left:32px; bottom:30px; max-width:300px; font-size:.68rem; line-height:1.6;

</style>

,-45.0,-65.0,-45.0,-63.0,-47.0,-75.0,-47.0,-73.0,-47.0,-71.0,-47.0,-69.0,-47.0,-67.0,-47.0,-65.0,-47.0,-63.0,-49.0,-75.0,-49.0,-73.0,-49.0,-71.0,-49.0,-69.0,-49.0,-67.0,-49.0,-65.0,-49.0,-63.0,-51.0,-73.0,-51.0,-71.0,-51.0,-69.0,-51.0,-67.0,-51.0,-65.0,-53.0,-73.0,-53.0,-71.0,-53.0,-69.0,-53.0,-67.0,-53.0,-65.0,-55.0,-73.0,-55.0,-71.0,-55.0,-69.0,-55.0,-67.0,-57.0,-73.0,-57.0,-71.0,-57.0,-69.0,-57.0,-67.0,-59.0,-71.0,-59.0,-69.0];
const SAO_PAULO = { lat: -23.5505, lon: -46.6333 };

const stage = document.getElementById('stage');
let width = window.innerWidth, height = window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width/height, 0.1, 100);
camera.position.set(0, 0, 9);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
stage.appendChild(renderer.domElement);

// ---- lights ----
scene.add(new THREE.AmbientLight(0x2a3d3a, 1.2));
const key = new THREE.PointLight(0x14b8a6, 2.4, 30);
key.position.set(6, 4, 8);
scene.add(key);

// ---- starfield ----
const starGeo = new THREE.BufferGeometry();
const starCount = 1400;
const starPos = new Float32Array(starCount*3);
for (let i=0;i<starCount;i++){
  const r = 40 + Math.random()*30;
  const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
  starPos[i*3]   = r*Math.sin(ph)*Math.cos(th);
  starPos[i*3+1] = r*Math.sin(ph)*Math.sin(th);
  starPos[i*3+2] = r*Math.cos(ph);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xC9D6DE, size:0.06, transparent:true, opacity:.75})));

// ---- globe group ----
const globe = new THREE.Group();
scene.add(globe);
const R = 2.6;

// wireframe sphere (lat/long grid)
const wireGeo = new THREE.WireframeGeometry(new THREE.SphereGeometry(R, 28, 16));
const wireMat = new THREE.LineBasicMaterial({ color:0x14b8a6, transparent:true, opacity:.14 });
globe.add(new THREE.LineSegments(wireGeo, wireMat));

// faint solid core so the far side of the wireframe reads behind the near side
const coreMat = new THREE.MeshBasicMaterial({ color:0x050506, transparent:true, opacity:.55 });
globe.add(new THREE.Mesh(new THREE.SphereGeometry(R*0.995, 28, 16), coreMat));

function latLonToVec3(lat, lon, radius) {
  const phi = (90 - lat) * Math.PI/180;
  const theta = (lon + 180) * Math.PI/180;
  return new THREE.Vector3(
    -radius*Math.sin(phi)*Math.cos(theta),
    radius*Math.cos(phi),
    radius*Math.sin(phi)*Math.sin(theta)
  );
}

// land dots
const landPos = new Float32Array((LAND_FLAT.length/2)*3);
for (let i=0, p=0; i<LAND_FLAT.length; i+=2, p+=3) {
  const v = latLonToVec3(LAND_FLAT[i], LAND_FLAT[i+1], R*1.004);
  landPos[p]=v.x; landPos[p+1]=v.y; landPos[p+2]=v.z;
}
const landGeo = new THREE.BufferGeometry();
landGeo.setAttribute('position', new THREE.BufferAttribute(landPos,3));

// soft round dot texture, drawn on a canvas (no external image needed)
function dotTexture(color) {
  const c = document.createElement('canvas'); c.width=c.height=32;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(16,16,0,16,16,16);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,32,32);
  return new THREE.CanvasTexture(c);
}
const landMat = new THREE.PointsMaterial({
  size:0.052, map:dotTexture('rgba(20,184,166,1)'), transparent:true, opacity:.85,
  depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true,
});
globe.add(new THREE.Points(landGeo, landMat));

// São Paulo marker: pulsing dot + glow + beacon ring
const spPos = latLonToVec3(SAO_PAULO.lat, SAO_PAULO.lon, R*1.01);
const spGroup = new THREE.Group();
spGroup.position.copy(spPos);
spGroup.lookAt(spPos.clone().multiplyScalar(2));
globe.add(spGroup);

const spCore = new THREE.Sprite(new THREE.SpriteMaterial({
  map:dotTexture('rgba(255,37,0,1)'), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
}));
spCore.scale.set(0.16,0.16,1);
spGroup.add(spCore);

const spGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map:dotTexture('rgba(255,80,40,0.9)'), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
}));
spGlow.scale.set(0.5,0.5,1);
spGroup.add(spGlow);

// label sprite
function labelSprite(text) {
  const c = document.createElement('canvas'); c.width=256; c.height=64;
  const ctx = c.getContext('2d');
  ctx.font = '600 28px Inter, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 4, 34);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false });
  const spr = new THREE.Sprite(mat);
  spr.scale.set(1.3, 0.33, 1);
  return spr;
}
const spLabel = labelSprite('São Paulo');
spLabel.position.set(0.55, 0.12, 0);
spGroup.add(spLabel);

// ---- drag-to-orbit + auto-rotate (self-contained, no OrbitControls addon) ----
let isDragging=false, lastX=0, lastY=0, velY=0.0022, userRotX=0, userRotY=0;
stage.addEventListener('pointerdown', e=>{ isDragging=true; lastX=e.clientX; lastY=e.clientY; });
window.addEventListener('pointerup', ()=> isDragging=false);
window.addEventListener('pointermove', e=>{
  if(!isDragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  userRotY += dx*0.004; userRotX += dy*0.004;
  userRotX = Math.max(-1.2, Math.min(1.2, userRotX));
  lastX=e.clientX; lastY=e.clientY;
});

let autoAngle = 0.6;
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  if(!isDragging) autoAngle += velY;
  globe.rotation.y = autoAngle + userRotY;
  globe.rotation.x = userRotX;
  const pulse = 1 + Math.sin(t*2.4)*0.25;
  spGlow.scale.set(0.5*pulse, 0.5*pulse, 1);
  spCore.material.opacity = 0.75 + Math.sin(t*2.4)*0.25;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', ()=>{
  width = window.innerWidth; height = window.innerHeight;
  camera.aspect = width/height; camera.updateProjectionMatrix();
  renderer.setSize(width, height);
});
</script>
