
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="150" viewBox="0 0 760 150" role="img" aria-label="Helipad Detector">
<title>Helipad Detector</title>
<defs>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#005C48"/><stop offset=".2" stop-color="#005B46"/><stop offset=".3" stop-color="#425943"/><stop offset=".4" stop-color="#6E513B"/><stop offset=".5" stop-color="#924227"/><stop offset=".6" stop-color="#B02813"/><stop offset=".7" stop-color="#C20000"/><stop offset=".8" stop-color="#D80000"/><stop offset="1" stop-color="#DD0000"/></linearGradient>
<radialGradient id="bg" cx=".5" cy=".4" r=".9"><stop offset="0" stop-color="#0b1216"/><stop offset="1" stop-color="#05080b"/></radialGradient>
<clipPath id="txt"><text x="380.0" y="92" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="76" font-weight="700" letter-spacing="1">Helipad Detector</text></clipPath>
<style>
@keyframes sweep{0%{transform:translateX(-260px)}60%,100%{transform:translateX(820px)}}
.sw{animation:sweep 5.5s ease-in-out infinite}
</style>
</defs>
<rect width="760" height="150" rx="14" fill="url(#bg)"/>
<text x="380.0" y="92" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="76" font-weight="700" letter-spacing="1"><tspan fill="#FFFFFF">Helipad </tspan><tspan fill="#8B0000">D</tspan><tspan fill="#991414">e</tspan><tspan fill="#A61B1B">t</tspan><tspan fill="#B32222">e</tspan><tspan fill="#C62828">c</tspan><tspan fill="#D32F2F">t</tspan><tspan fill="#C62828">o</tspan><tspan fill="#B71C1C">r</tspan></text>
<g clip-path="url(#txt)"><rect class="sw" x="0" y="20" width="220" height="90" fill="url(#sheen)" transform="skewX(-18)"/></g>
<rect x="170.0" y="112" width="420" height="2" rx="1" fill="url(#line)"/>
</svg>
