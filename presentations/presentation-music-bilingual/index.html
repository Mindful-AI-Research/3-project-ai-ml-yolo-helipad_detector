    rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box }

    :root {
      --bg: #050506;
      --surface: #0d0f10;
      --surface2: #16191b;
      --teal: #0E756D;
      --teal-dim: #0a5b55;
      --teal-glow: rgba(14, 117, 109, .18);
      --red: #FF2500;
      --red-glow: rgba(255, 37, 0, .16);
      --white: #fff;
      --w90: rgba(255, 255, 255, .9);
      --w70: rgba(255, 255, 255, .7);
      --w50: rgba(255, 255, 255, .5);
      --w20: rgba(255, 255, 255, .12);
      --w10: rgba(255, 255, 255, .06);
      --border: rgba(14, 117, 109, .30);
      --border2: rgba(14, 117, 109, .55);
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --slide-transition: .55s cubic-bezier(.4, 0, .2, 1);
    }

    [data-theme="light"] {
      --bg: #f5f5f7;
      --surface: #fff;
      --surface2: #f0f0f5;
      --white: #14181a;
      --w90: rgba(0, 0, 0, .85);
      --w70: rgba(0, 0, 0, .65);
      --w50: rgba(0, 0, 0, .45);
      --w20: rgba(0, 0, 0, .1);
      --w10: rgba(0, 0, 0, .04);
      --border: rgba(14, 117, 109, .30);
      --border2: rgba(14, 117, 109, .55);
    }

    html, body { height: 100%; overflow: hidden; font-family: var(--font) }
    body { background: var(--bg); color: var(--white); transition: background .4s, color .4s }

    #stage { position: fixed; inset: 0; background: var(--bg) }

    .slide {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: center;
      padding: 112px 100px 132px;
      opacity: 0; pointer-events: none; transform: scale(.97);
      filter: blur(0px);
      transition: opacity var(--slide-transition), transform var(--slide-transition), filter var(--slide-transition);
      overflow-y: auto; overflow-x: hidden;
    }
    .slide.active { opacity: 1; pointer-events: all; transform: scale(1); filter: blur(0px) }
    .slide.slide-top-align { justify-content: flex-start; padding-top: 132px; }
    .slide.exit-up { opacity: 0; transform: scale(1.035); filter: blur(7px) }
    .slide.exit-down { opacity: 0; transform: scale(.94); filter: blur(7px) }
    .slide-content { position: relative; z-index: 2 }

    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(14, 117, 109, .10) 0%, transparent 60%);
    }

    .hud {
      position: fixed; top: 22px; right: 250px;
      display: flex; align-items: center; gap: 8px;
      background: rgba(13, 15, 16, .84); border: 1px solid var(--border);
      border-radius: 100px; padding: 6px 12px; backdrop-filter: blur(20px);
      z-index: 1000; transition: opacity .3s; max-width: 56vw; overflow-x: auto;
    }
    .hud-dots { display: flex; gap: 6px; align-items: center }
    .hud-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--w20); border: none; cursor: pointer; transition: all .3s; flex: none }
    .hud-dot.on { background: var(--teal); box-shadow: 0 0 8px var(--teal); transform: scale(1.4) }
    .hud-dot:hover:not(.on) { background: var(--w50) }
    .hud-sep { width: 1px; height: 14px; background: var(--w20); flex: none }
    .hud-btn { background: none; border: none; cursor: pointer; color: var(--w50); font-size: 13px; line-height: 1; padding: 3px 5px; border-radius: 6px; transition: color .2s, background .2s; white-space: nowrap; font-family: var(--font) }
    .hud-btn:hover { color: var(--teal); background: var(--teal-glow) }
    .hud-btn:disabled { opacity: .3; cursor: default }
    .hud-btn.danger:hover { color: var(--red); background: var(--red-glow) }

    .slide-counter { position: fixed; bottom: 24px; left: 28px; font-family: var(--mono); font-size: .72rem; color: var(--w50); letter-spacing: .1em; z-index: 1000; text-align: left }
    .slide-counter span { color: var(--teal) }

    .lang-switch {
      position: fixed; top: 28px; right: 36px; z-index: 1000;
      display: flex; align-items: center; gap: 2px;
      background: rgba(13, 15, 16, .92); border: 1.5px solid var(--border2);
      border-radius: 100px; padding: 3px; backdrop-filter: blur(20px);
      cursor: pointer; transition: border-color .25s, box-shadow .25s, transform .15s;
      box-shadow: 0 6px 20px rgba(0,0,0,.35);
    }
    .lang-switch:hover { border-color: var(--teal); box-shadow: 0 6px 24px var(--teal-glow); transform: translateY(-1px) }
    .lang-opt {
      padding: 5px 11px; border-radius: 100px; font-family: var(--mono);
      font-size: .64rem; font-weight: 600; letter-spacing: .05em; color: var(--w50);
      transition: all .25s; white-space: nowrap;
    }
    .lang-opt.active { background: var(--teal); color: #fff; box-shadow: 0 2px 10px var(--teal-glow) }

    .timeline-track { position: fixed; top: 0; left: 0; right: 0; height: 4px; background: var(--w10); z-index: 1001; cursor: pointer }
    .timeline-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--red)); transition: width .4s cubic-bezier(.4,0,.2,1) }
    .timeline-track:hover { height: 8px }

    .eyebrow { font-family: var(--mono); font-size: .68rem; color: var(--teal); letter-spacing: .22em; text-transform: uppercase; margin-bottom: 20px; display: flex; align-items: center; gap: 12px }
    .eyebrow::after { content: ''; flex: 1; max-width: 48px; height: 1px; background: var(--teal-dim) }
    .headline { font-size: clamp(1.9rem, 4vw, 3.6rem); font-weight: 700; line-height: 1.12; letter-spacing: -.02em; margin-bottom: 18px }
    .headline.dense { font-size: clamp(1.4rem, 2.6vw, 2.3rem); margin-bottom: 10px }
    .accent { color: var(--teal); font-weight: 400 }
    .accent-red { color: var(--red) }
    .subline { font-size: clamp(.92rem, 1.5vw, 1.14rem); color: var(--w70); line-height: 1.7; font-weight: 300; max-width: 660px }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 22px 24px; transition: border-color .3s, box-shadow .3s, transform .15s ease-out; transform-style: preserve-3d; will-change: transform }
    .card:hover { border-color: var(--border2); box-shadow: 0 20px 46px rgba(14, 117, 109, .14) }
    .card-icon { font-size: 1.5rem; margin-bottom: 10px }
    .card-title { font-size: .98rem; font-weight: 600; color: var(--teal); margin-bottom: 7px }
    .card-body { font-size: .85rem; color: var(--w70); line-height: 1.6 }

    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px }
    .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px }
    .g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px }

    .kpi { text-align: center; background: rgba(14, 117, 109, .05); border: 1px solid var(--border); border-radius: 16px; padding: 22px 10px; transition: all .3s }
    .kpi:hover { background: rgba(14, 117, 109, .09); transform: translateY(-2px) }
    .kpi-value { font-size: 2.1rem; font-weight: 700; color: var(--teal); line-height: 1; margin-bottom: 6px; font-variant-numeric: tabular-nums }
    .kpi-label { font-size: .66rem; color: var(--w50); text-transform: uppercase; letter-spacing: .09em }

    .tbl { width: 100%; border-collapse: collapse }
    .tbl th { font-family: var(--mono); font-size: .6rem; color: var(--teal); letter-spacing: .1em; text-transform: uppercase; padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: left }
    .tbl td { padding: 10px 12px; font-size: .82rem; color: var(--w70); border-bottom: 1px solid var(--w10) }
    .tbl.dense th { font-size: .54rem; padding: 6px 10px }
    .tbl.dense td { padding: 6px 10px; font-size: .72rem; line-height: 1.35 }
    .tbl tr:hover td { background: rgba(14, 117, 109, .04) }
    .tbl td.num, .tbl th.num { text-align: center; font-variant-numeric: tabular-nums }

    .grain-overlay { position: fixed; inset: 0; z-index: 1500; pointer-events: none; opacity: .035; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>") }
    .vignette-overlay { position: fixed; inset: 0; z-index: 1499; pointer-events: none;
      background: radial-gradient(ellipse 78% 78% at 50% 48%, transparent 55%, rgba(0,0,0,.4) 100%) }

    .hud-ring { flex: none }
    .hud-ring text { font-family: var(--mono); font-variant-numeric: tabular-nums }

    .pipeline { display: grid; gap: 0; margin: 22px 0 }
    .pipe { background: var(--surface); border: 1px solid var(--border); border-right: none; padding: 16px 12px; text-align: center; position: relative; transition: all .3s }
    .pipe:last-child { border-right: 1px solid var(--border) }
    .pipe:hover { background: rgba(14, 117, 109, .06); border-color: var(--border2) }
    .pipe::after { content: '→'; position: absolute; right: -12px; top: 50%; transform: translateY(-50%); color: var(--teal); font-size: .85rem; z-index: 2 }
    .pipe:last-child::after { content: '' }
    .pipe-nb { font-family: var(--mono); font-size: .56rem; color: var(--teal); letter-spacing: .14em; margin-bottom: 6px }
    .pipe-t { font-weight: 600; font-size: .84rem; margin-bottom: 4px }
    .pipe-d { font-size: .68rem; color: var(--w50); line-height: 1.5 }

    .badge { display: inline-flex; align-items: center; gap: 5px; background: rgba(14, 117, 109, .12); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; font-family: var(--mono); font-size: .66rem; color: var(--teal) }
    .badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px }

    .roadmap-item { display: flex; gap: 16px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--w10) }
    .roadmap-item:last-child { border-bottom: none }
    .roadmap-dot { width: 10px; height: 10px; min-width: 10px; border-radius: 50%; background: var(--teal); margin-top: 4px; box-shadow: 0 0 8px var(--teal) }
    .roadmap-title { font-size: .88rem; font-weight: 500; margin-bottom: 3px }
    .roadmap-desc { font-size: .78rem; color: var(--w50) }

    .code { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; font-family: var(--mono); font-size: .74rem; color: #8fe0d8; line-height: 1.7; overflow-x: auto; white-space: pre }
    .hl { background: rgba(14, 117, 109, .06); backdrop-filter: blur(14px); border: 1px solid var(--border); border-left: 3px solid var(--red); border-radius: 10px; padding: 13px 17px; font-size: .86rem; color: var(--w70); line-height: 1.6 }
    .hl.dense { padding: 9px 14px; font-size: .74rem; line-height: 1.45 }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes pipelineFlow { to { stroke-dashoffset: -24 } }
    .pipeline-svg-wrap svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
    .pipeline-svg-wrap::-webkit-scrollbar { width: 10px; }
    .pipeline-svg-wrap::-webkit-scrollbar-track { background: rgba(255,255,255,0.04); border-radius: 8px; }
    .pipeline-svg-wrap::-webkit-scrollbar-thumb { background: var(--teal); border-radius: 8px; }
    .pipeline-svg-wrap { scrollbar-color: var(--teal) rgba(255,255,255,0.04); scrollbar-width: thin; }
    .animate { animation: fadeUp .6s cubic-bezier(.22, 1, .36, 1) both }
    .d1 { animation-delay: .08s } .d2 { animation-delay: .16s } .d3 { animation-delay: .24s }
    .d4 { animation-delay: .32s } .d5 { animation-delay: .4s }


    /* ── Cover / helicopter scene ── */
    .hero-stage { position: absolute; inset: 0; overflow: hidden; pointer-events: none }
    .hero-glow { position: absolute; right: -6%; top: 46%; transform: translateY(-50%); width: 560px; height: 560px; background: radial-gradient(circle, rgba(14,117,109,.14) 0%, transparent 70%); border-radius: 50%; border: 1px solid var(--border) }
    .hero-glow::after { content: ''; position: absolute; inset: 60px; border: 1px solid rgba(14,117,109,.12); border-radius: 50% }
    .heli-pad { position: absolute; right: 8%; top: 62%; width: 210px; height: 210px; border: 1px solid var(--border2); border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: .55 }
    .heli-pad::before { content: 'H'; font-family: var(--mono); font-size: 2.6rem; color: var(--teal-dim); font-weight: 700 }
    .heli-pad::after { content: ''; position: absolute; inset: 22px; border: 1px dashed rgba(14,117,109,.35); border-radius: 50% }
    .heli { position: absolute; font-size: 2.4rem; filter: drop-shadow(0 0 18px rgba(14,117,109,.55)); animation: heliFly 13s ease-in-out infinite; will-change: transform }
    @keyframes heliFly {
      0%   { top: 18%; left: -6%;  transform: rotate(2deg) scale(.9); }
      22%  { top: 30%; left: 30%;  transform: rotate(-2deg) scale(1); }
      46%  { top: 22%; left: 62%;  transform: rotate(3deg) scale(1.05); }
      68%  { top: 55%; left: 74%;  transform: rotate(-1deg) scale(.95); }
      86%  { top: 60%; left: 82%;  transform: rotate(0deg) scale(.85); }
      100% { top: 62%; left: 84%;  transform: rotate(0deg) scale(.8); }
    }
    .rotor { display: inline-block; animation: rotorSpin .18s linear infinite }
    @keyframes rotorSpin { from { filter: hue-rotate(0deg) } to { filter: hue-rotate(2deg) } }
    .cover-scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(14,117,109,.05) 0px, transparent 1px, transparent 3px); pointer-events: none; opacity: .5 }

    .three-cover { position: absolute; inset: 0; z-index: 1; cursor: grab }
    .three-cover:active { cursor: grabbing }
    .three-cover canvas { display: block; width: 100% !important; height: 100% !important }

    .heli-ambient { position: fixed; inset: 0; pointer-events: none; z-index: -1 }
    .heli-svg { position: absolute; width: 42px; height: 42px; opacity: .55; color: #FF2500; filter: drop-shadow(0 0 4px rgba(255,37,0,.3)); animation: heliPerimeterA 28s cubic-bezier(.42,0,.58,1) infinite; will-change: transform, top, left }
    .heli-svg .drone-blade { transform-box: fill-box; transform-origin: center; animation: rotorSpin .75s linear infinite }
    @keyframes rotorSpin { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
    /* Perimeter-only path: hugs the top strip, right strip, bottom strip, left strip — the
       central content column (where headline/body copy lives) is never entered. Extra
       waypoints keep both position and rotation changing gradually for a calm, gliding feel. */
    @keyframes heliPerimeterA {
      0%   { top: 4%;   left: 3%;    transform: rotate(-4deg)  scale(.92) }
      6%   { top: 3.3%; left: 15%;   transform: rotate(0deg)   scale(.94) }
      14%  { top: 3%;   left: 35%;   transform: rotate(2deg)   scale(.97) }
      22%  { top: 3.3%; left: 60%;   transform: rotate(6deg)   scale(1) }
      28%  { top: 4%;   left: 80%;   transform: rotate(20deg)  scale(1.01) }
      34%  { top: 8%;   left: 92%;   transform: rotate(45deg)  scale(1.03) }
      40%  { top: 20%;  left: 95%;   transform: rotate(75deg)  scale(1.05) }
      48%  { top: 40%;  left: 95.5%; transform: rotate(90deg)  scale(1.03) }
      56%  { top: 68%;  left: 94%;   transform: rotate(100deg) scale(1) }
      64%  { top: 90%;  left: 88%;   transform: rotate(130deg) scale(.99) }
      70%  { top: 96%;  left: 72%;   transform: rotate(165deg) scale(1.02) }
      76%  { top: 97%;  left: 50%;   transform: rotate(180deg) scale(1) }
      82%  { top: 96%;  left: 28%;   transform: rotate(185deg) scale(1.02) }
      88%  { top: 88%;  left: 8%;    transform: rotate(220deg) scale(.97) }
      94%  { top: 55%;  left: 3%;    transform: rotate(270deg) scale(.93) }
      98%  { top: 20%;  left: 2.5%;  transform: rotate(320deg) scale(.9) }
      100% { top: 4%;   left: 3%;    transform: rotate(356deg) scale(.92) }
    }

    /* ── Bars ── */
    .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 9px }
    .bar-label { font-size: .74rem; color: var(--w70); min-width: 168px }
    .bar-track { flex: 1; height: 6px; background: var(--w10); border-radius: 3px; overflow: hidden }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--red)); border-radius: 3px }
    .bar-val { font-family: var(--mono); font-size: .66rem; color: var(--teal); min-width: 40px; text-align: right; font-variant-numeric: tabular-nums }

    /* ── Shortcuts modal ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(6px); z-index: 2000; display: flex; align-items: center; justify-content: center }
    .modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 18px; padding: 32px 36px; max-width: 420px; width: 90%; box-shadow: 0 30px 80px rgba(0,0,0,.5) }
    .modal h3 { font-size: 1.1rem; margin-bottom: 18px; color: var(--teal) }
    .modal-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--w10); font-size: .84rem; color: var(--w70) }
    .modal-row kbd { font-family: var(--mono); background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; color: var(--teal); font-size: .74rem }
    .modal-close { margin-top: 20px; width: 100%; background: var(--teal); color: #fff; border: none; border-radius: 10px; padding: 10px; font-family: var(--font); font-weight: 600; cursor: pointer }

    @media(max-width:900px) {
      .slide { padding: 64px 26px 100px }
      .g2, .g3, .g4 { grid-template-columns: 1fr }
      .pipeline { grid-template-columns: 1fr !important }
      .pipe { border-right: 1px solid var(--border); border-bottom: none }
      .pipe:last-child { border-bottom: 1px solid var(--border) }
      .pipe::after { content: '↓'; right: 50%; bottom: -12px; top: auto; transform: translateX(50%) }
      .pipe:last-child::after { content: '' }
      .heli-pad { display: none }
    }
  </style>
</head>

    function PipelineDiagram({ svg, hint }) {

      // The diagram is inherently tall (4 stacked pipeline stages) — a

      return (

    class ThreeErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { failed: false }; }
      static getDerivedStateFromError() { return { failed: true }; }
      componentDidCatch(err) { console.error('Cover 3D scene failed, falling back:', err); }
      render() { return this.state.failed ? this.props.fallback : this.props.children; }
    }

    function FlatHeroFallback({ errorMsg }) {
      return (
        <>
          <div className="hero-glow" />
          <div className="heli-pad" />
          <div className="heli">🚁</div>
        </>
      );
    }

    function ThreeCoverScene() {
      const mountRef = useRef(null);
      const [failed, setFailed] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      useEffect(() => {
        const mount = mountRef.current;
        if (!mount || !window.THREE) { setErrorMsg(!mount ? 'mount ref missing' : 'window.THREE not loaded (three.js CDN script failed)'); setFailed(true); return; }
        const THREE = window.THREE;
        let width = mount.clientWidth, height = mount.clientHeight;
        let raf, renderer, cleanupResize, cleanupMouse, cleanupDrag, cleanupMount = mount;
        try {
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        mount.appendChild(renderer.domElement);

        // Self-contained orbit + parallax (no external OrbitControls addon — one less network dependency to fail)
        const orbitTarget = new THREE.Vector3(0.3, 0.1, 0);
        const orbitRadius = 9;
        let baseAzimuth = 0.35, azimuth = 0.35, polar = Math.PI / 2.25;
        let isDragging = false, lastPX = 0, lastPY = 0;
        const applyCamera = () => {
          const sinP = Math.sin(polar);
          camera.position.set(
            orbitTarget.x + orbitRadius * sinP * Math.sin(azimuth),
            orbitTarget.y + orbitRadius * Math.cos(polar),
            orbitTarget.z + orbitRadius * sinP * Math.cos(azimuth)
          );
          camera.lookAt(orbitTarget);
        };
        applyCamera();

        const onDown = (e) => { isDragging = true; lastPX = e.clientX; lastPY = e.clientY; };
        const onMove = (e) => {
          if (!isDragging) return;
          const dx = e.clientX - lastPX, dy = e.clientY - lastPY;
          baseAzimuth -= dx * 0.0045;
          polar = Math.min(Math.PI / 1.7, Math.max(Math.PI / 3, polar - dy * 0.0045));
          lastPX = e.clientX; lastPY = e.clientY;
        };
        const onUp = () => { isDragging = false; };
        mount.addEventListener('pointerdown', onDown);
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        cleanupDrag = { onDown, onMove, onUp };

        scene.add(new THREE.AmbientLight(0x2a3d3a, 1.3));
        const key = new THREE.PointLight(0x14b8a6, 3.2, 22);
        key.position.set(3, 3, 4);
        scene.add(key);
        const rim = new THREE.PointLight(0xff2500, 1.3, 18);
        rim.position.set(-4, -1, -3);
        scene.add(rim);

        const starGeo = new THREE.BufferGeometry();
        const starCount = 850;
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
          starPos[i*3]   = (Math.random() - 0.5) * 60;
          starPos[i*3+1] = (Math.random() - 0.5) * 60;
          starPos[i*3+2] = (Math.random() - 0.5) * 60 - 10;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xC9D6DE, size: 0.055, transparent: true, opacity: 0.85 });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        const partGeo = new THREE.BufferGeometry();
        const partCount = 200;
        const partPos = new Float32Array(partCount * 3);
        for (let i = 0; i < partCount; i++) {
          partPos[i*3]   = (Math.random() - 0.5) * 14;
          partPos[i*3+1] = (Math.random() - 0.5) * 8;
          partPos[i*3+2] = (Math.random() - 0.5) * 10;
        }
        partGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
        const partMat = new THREE.PointsMaterial({ color: 0x2fe8d4, size: 0.05, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending });
        const particles = new THREE.Points(partGeo, partMat);
        scene.add(particles);

        const auroraGeo = new THREE.PlaneGeometry(42, 20, 1, 1);
        const auroraMat = new THREE.ShaderMaterial({
          transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
          uniforms: { uTime: { value: 0 } },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            varying vec2 vUv;
            uniform float uTime;
            void main() {
              float t = uTime * 0.15;
              float y = vUv.y;
              float wave1 = sin(vUv.x * 6.0 + t * 2.0) * 0.09;
              float wave2 = sin(vUv.x * 11.0 - t * 1.4) * 0.05;
              float band = smoothstep(0.0, 0.5, y + wave1) - smoothstep(0.5, 1.0, y + wave1 + wave2);
              vec3 teal = vec3(0.055, 0.46, 0.43);
              vec3 green = vec3(0.24, 0.85, 0.55);
              vec3 col = mix(teal, green, sin(vUv.x * 4.0 + t) * 0.5 + 0.5);
              float alpha = band * 0.55 * smoothstep(0.0, 0.15, y) * smoothstep(1.0, 0.7, y);
              gl_FragColor = vec4(col, alpha);
            }
          `,
        });
        const aurora = new THREE.Mesh(auroraGeo, auroraMat);
        aurora.position.set(0, 4, -14);
        scene.add(aurora);

        const heli = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x8a0f00, emissive: 0xFF2500, emissiveIntensity: 0.6, metalness: 0.35, roughness: 0.32 });
        const accentMat = new THREE.MeshStandardMaterial({ color: 0x111315, metalness: 0.6, roughness: 0.4 });

        const body = new THREE.Mesh(new THREE.SphereGeometry(0.62, 20, 16), bodyMat);
        body.scale.set(1.35, 0.85, 1);
        heli.add(body);

        const tailBoom = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.05, 1.5, 10), accentMat);
        tailBoom.rotation.z = Math.PI / 2;
        tailBoom.position.set(-1.35, 0.05, 0);
        heli.add(tailBoom);

        const tailFin = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.5, 8), bodyMat);
        tailFin.rotation.z = Math.PI / 2.4;
        tailFin.position.set(-2.05, 0.28, 0);
        heli.add(tailFin);

        const skidGeo = new THREE.CylinderGeometry(0.03, 0.03, 1.3, 6);
        const skidL = new THREE.Mesh(skidGeo, accentMat); skidL.rotation.z = Math.PI / 2; skidL.position.set(0, -0.62, 0.35);
        const skidR = skidL.clone(); skidR.position.z = -0.35;
        heli.add(skidL, skidR);

        const rotorGroup = new THREE.Group();
        const bladeGeo = new THREE.BoxGeometry(2.6, 0.03, 0.12);
        const blade1 = new THREE.Mesh(bladeGeo, accentMat);
        const blade2 = blade1.clone(); blade2.rotation.y = Math.PI / 2;
        rotorGroup.add(blade1, blade2);
        rotorGroup.position.set(0, 0.62, 0);
        heli.add(rotorGroup);

        const tailRotorGroup = new THREE.Group();
        const tBladeGeo = new THREE.BoxGeometry(0.05, 0.5, 0.06);
        const tBlade1 = new THREE.Mesh(tBladeGeo, accentMat);
        const tBlade2 = tBlade1.clone(); tBlade2.rotation.x = Math.PI / 2;
        tailRotorGroup.add(tBlade1, tBlade2);
        tailRotorGroup.position.set(-2.05, 0.28, 0.18);
        heli.add(tailRotorGroup);

        heli.scale.setScalar(0.85);
        heli.position.set(0.6, 0, 0);
        scene.add(heli);

        // Soft contact-shadow blob that trails beneath the helicopter for depth grounding
        const shadowCanvas = document.createElement('canvas');
        shadowCanvas.width = 128; shadowCanvas.height = 128;
        const sctx = shadowCanvas.getContext('2d');
        const sgrad = sctx.createRadialGradient(64, 64, 0, 64, 64, 64);
        sgrad.addColorStop(0, 'rgba(0,0,0,0.5)');
        sgrad.addColorStop(1, 'rgba(0,0,0,0)');
        sctx.fillStyle = sgrad; sctx.fillRect(0, 0, 128, 128);
        const shadowTex = new THREE.CanvasTexture(shadowCanvas);
        const shadowMat = new THREE.SpriteMaterial({ map: shadowTex, transparent: true, depthWrite: false, opacity: 0.4 });
        const shadowSprite = new THREE.Sprite(shadowMat);
        shadowSprite.scale.set(2.2, 2.2, 1);
        shadowSprite.position.set(0.6, -3.4, -3);
        scene.add(shadowSprite);

        // Cheap additive "glow" behind the helicopter — bloom-like look with zero extra dependencies
        const glowCanvas = document.createElement('canvas');
        glowCanvas.width = 128; glowCanvas.height = 128;
        const gctx = glowCanvas.getContext('2d');
        const ggrad = gctx.createRadialGradient(64, 64, 0, 64, 64, 64);
        ggrad.addColorStop(0, 'rgba(255,60,20,0.75)');
        ggrad.addColorStop(0.5, 'rgba(255,37,0,0.28)');
        ggrad.addColorStop(1, 'rgba(255,37,0,0)');
        gctx.fillStyle = ggrad; gctx.fillRect(0, 0, 128, 128);
        const glowTex = new THREE.CanvasTexture(glowCanvas);
        const glowMat = new THREE.SpriteMaterial({ map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.85 });
        const glowSprite = new THREE.Sprite(glowMat);
        glowSprite.scale.set(2.6, 2.6, 1);
        scene.add(glowSprite);

        // Mouse-reactive parallax (in addition to drag-to-orbit)
        const mouse = { x: 0, y: 0 };
        const onMouseMove = (e) => {
          const r = mount.getBoundingClientRect();
          mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1;
          mouse.y = ((e.clientY - r.top) / r.height) * 2 - 1;
        };
        mount.addEventListener('mousemove', onMouseMove);
        cleanupMouse = onMouseMove;

        const clock = new THREE.Clock();
        const animate = () => {
          raf = requestAnimationFrame(animate);
          try {
            const t = clock.getElapsedTime();
            rotorGroup.rotation.y += 0.95;
            tailRotorGroup.rotation.x += 1.15;

            // Wide, smooth looping flight path across the whole scene — fast and elegant, never robotic.
            const speed = 0.34;
            const px = Math.sin(t * speed) * 3.6;
            const pz = Math.sin(t * speed * 2 + 1.1) * 1.6 - 1.2;
            const py = Math.sin(t * speed * 1.7) * 1.1 + 0.3;
            const prevX = heli.position.x, prevY = heli.position.y;
            heli.position.set(px, py, pz);
            const bank = (px - prevX) * 2.2;
            const pitch = (py - prevY) * 2.4;
            heli.rotation.z = THREE.MathUtils.lerp(heli.rotation.z, -bank, 0.12);
            heli.rotation.x = THREE.MathUtils.lerp(heli.rotation.x, pitch, 0.12);
            heli.rotation.y = Math.atan2(Math.cos(t * speed) * speed, 1) * 0.6 + Math.PI * 0.02;

            const shadowScale = THREE.MathUtils.clamp(1.5 - py * 0.28, 0.6, 1.9);
            shadowSprite.position.x = px;
            shadowSprite.position.z = pz * 0.6 - 2.6;
            shadowSprite.scale.set(shadowScale * 2.2, shadowScale * 2.2, 1);
            shadowMat.opacity = THREE.MathUtils.clamp(0.46 - py * 0.13, 0.12, 0.46);

            glowSprite.position.set(px, py, pz);

            particles.rotation.y += 0.0009;
            stars.rotation.y += 0.00015;
            auroraMat.uniforms.uTime.value = t;

            // Orbit + parallax: slow auto-rotate always running; mouse nudges it further when not dragging
            if (!isDragging) {
              baseAzimuth += 0.0016;
              azimuth = THREE.MathUtils.lerp(azimuth, baseAzimuth + mouse.x * 0.22, 0.045);
              polar = THREE.MathUtils.lerp(polar, Math.PI / 2.25 - mouse.y * 0.14, 0.045);
            } else {
              azimuth = baseAzimuth;
            }
            applyCamera();

            renderer.render(scene, camera);
          } catch (e) { cancelAnimationFrame(raf); console.error('Cover 3D render loop error:', e); setErrorMsg('render loop: ' + (e && e.message ? e.message : String(e))); setFailed(true); }
        };
        animate();

        const onResize = () => {
          width = mount.clientWidth; height = mount.clientHeight;
          camera.aspect = width / height; camera.updateProjectionMatrix();
          renderer.setSize(width, height);
        };
        window.addEventListener('resize', onResize);
        cleanupResize = onResize;
        } catch (err) {
          console.error('Cover 3D scene setup failed, falling back to flat hero:', err);
          setErrorMsg('setup: ' + (err && err.message ? err.message : String(err)) + (err && err.stack ? ' | ' + err.stack.split('\n')[1] : ''));
          setFailed(true);
        }

        return () => {
          if (raf) cancelAnimationFrame(raf);
          if (cleanupResize) window.removeEventListener('resize', cleanupResize);
          if (cleanupMouse && cleanupMount) cleanupMount.removeEventListener('mousemove', cleanupMouse);
          if (cleanupDrag && cleanupMount) {
            cleanupMount.removeEventListener('pointerdown', cleanupDrag.onDown);
            window.removeEventListener('pointermove', cleanupDrag.onMove);
            window.removeEventListener('pointerup', cleanupDrag.onUp);
          }
          if (renderer) {
            renderer.dispose();
            if (mount.contains(renderer.domElement)) mount.removeChild(renderer.domElement);
          }
        };
      }, []);

      if (failed) return <FlatHeroFallback errorMsg={errorMsg} />;
      return <div ref={mountRef} className="three-cover" title="Drag to orbit" />;
    }

    function ProgressRing({ cur, total, onJump }) {
      const r = 14, c = 2 * Math.PI * r;
      const pct = cur / (total - 1);
      return (
        <svg width="34" height="34" viewBox="0 0 34 34" className="hud-ring" onClick={() => onJump(cur === total - 1 ? 0 : cur + 1)} style={{ cursor: 'pointer' }} title="Slide progress — click to advance">
          <circle cx="17" cy="17" r={r} fill="none" stroke="var(--w20)" strokeWidth="2.5" />
          <circle cx="17" cy="17" r={r} fill="none" stroke="var(--teal)" strokeWidth="2.5"
            strokeDasharray={c} strokeDashoffset={c * (1 - pct)} strokeLinecap="round"
            transform="rotate(-90 17 17)" style={{ transition: 'stroke-dashoffset .5s cubic-bezier(.4,0,.2,1)' }} />
          <text x="17" y="21" textAnchor="middle" fontSize="9" fill="var(--teal)">{cur + 1}</text>
        </svg>
      );
    }

    function tiltMove(e) {
      const el = e.currentTarget;
      const r = el.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - 0.5;
      const py = (e.clientY - r.top) / r.height - 0.5;
      el.style.transform = `perspective(700px) rotateX(${(-py * 7).toFixed(2)}deg) rotateY(${(px * 9).toFixed(2)}deg) translateY(-4px) translateZ(6px)`;
    }
    function tiltLeave(e) { e.currentTarget.style.transform = ''; }

    function Counter({ value, active }) {
      const m = typeof value === 'string' ? value.match(/^([^\d]*)([\d.,]+)(.*)$/) : null;
      const [display, setDisplay] = useState(value);
      useEffect(() => {
        if (!active || !m) { setDisplay(value); return; }
        const prefix = m[1], numStr = m[2], suffix = m[3];
        const hasComma = numStr.includes(',');
        const clean = numStr.replace(/,/g, '');
        const decimals = clean.includes('.') ? (clean.split('.')[1] || '').length : 0;
        const target = parseFloat(clean);
        if (isNaN(target)) { setDisplay(value); return; }
        let start = null, raf;
        const dur = 1000;
        const fmt = (n) => {
          let s = decimals ? n.toFixed(decimals) : String(Math.round(n));
          if (hasComma) s = Number(s).toLocaleString('en-US');
          return prefix + s + suffix;
        };
        setDisplay(fmt(0));
        const step = (ts) => {
          if (!start) start = ts;
          const p = Math.min(1, (ts - start) / dur);
          const eased = 1 - Math.pow(1 - p, 3);
          setDisplay(fmt(target * eased));
          if (p < 1) raf = requestAnimationFrame(step);
        };
        raf = requestAnimationFrame(step);
        return () => cancelAnimationFrame(raf);
      }, [active]);
      return display;
    }

    function Bar({ label, val, active }) {
      const [w, setW] = useState(0);
      useEffect(() => {
        if (active) { const t = setTimeout(() => setW(val), 80); return () => clearTimeout(t); }
        setW(0);
      }, [active, val]);
      return (
        <div className="bar-row">
          <div className="bar-label">{label}</div>
          <div className="bar-track"><div className="bar-fill" style={{ width: `${(w / 28) * 100}%`, transition: 'width 1.1s cubic-bezier(.22,1,.36,1)' }} /></div>
          <div className="bar-val"><Counter value={`${val}%`} active={active} /></div>
        </div>
      );
    }

              <div className="g2" style={{ gap: 48, alignItems: 'flex-start' }}>
                <div>

              <Title title={data.title} accent={data.titleAccent} />
              <div className="pipeline animate d2" style={{ gridTemplateColumns: `repeat(${data.cols || data.steps.length}, 1fr)` }}>
                {data.steps.map(([nb, t, d]) => (

                    <div className="pipe-nb">STEP {nb}</div>
                    <div className="pipe-t">{t}</div>

                ))}

            </>

          case 'mermaidpipeline': return (

              <Eyebrow n={n} label={data.eyebrow} />
              <Title title={data.title} accent={data.titleAccent} />
              <div className="animate d2" style={{ marginTop: 10 }}>
                <PipelineDiagram svg={data.part === 2 ? PIPELINE_SVG_2 : PIPELINE_SVG_1} hint={data.scrollHint} />
              </div>

          case 'arch': return (

              <Eyebrow n={n} label={data.eyebrow} />

              <div className="g4 animate d2" style={{ marginTop: 18 }}>
                {data.groups.map(([t, items]) => (
                  <div key={t} className="card" onMouseMove={tiltMove} onMouseLeave={tiltLeave}>
                    <div className="card-title" style={{ marginBottom: 12 }}>{t}</div>
                    {items.map((it, i) => (
                      <div key={i} style={{ fontSize: '.76rem', color: 'var(--w70)', padding: '6px 0', borderTop: i > 0 ? '1px solid var(--w10)' : 'none' }}>{it}</div>
                    ))}
                  </div>
                ))}
              </div>
            </>
          );

          case 'code': return (
            <>
              <Eyebrow n={n} label={data.eyebrow} />
              <div className="g2" style={{ gap: 44, alignItems: 'flex-start' }}>
                <div>
                  <Title title={data.title} accent={data.titleAccent} />
                  <p className="subline animate d2" style={{ marginBottom: 18 }}>{data.text}</p>
                  <div style={{ display: 'flex', flexDirection: 'column' }} className="animate d3">
                    {data.list.map((item, i) => (
                      <div key={i} className="roadmap-item"><div className="roadmap-dot" /><div className="roadmap-desc" style={{ fontSize: '.82rem', color: 'var(--w90)' }}>{item}</div></div>
                    ))}
                  </div>
                </div>
                <pre className="code animate d2">{data.code}</pre>
              </div>
            </>
          );

          case 'table': return (
            <>
              <Eyebrow n={n} label={data.eyebrow} />
              <Title title={data.title} accent={data.titleAccent} dense={data.dense} />
              <div className="animate d2" style={{ overflowX: 'auto' }}>
                <table className={`tbl${data.dense ? ' dense' : ''}`}>
                  <thead><tr>{data.headers.map((h, i) => <th key={i} className={data.colClasses ? data.colClasses[i] : (i > 0 ? 'num' : '')}>{h}</th>)}</tr></thead>
                  <tbody>
                    {data.rows.map((r, i) => (
                      <tr key={i}>{r.map((c, j) => (
                        <td key={j} className={data.colClasses ? data.colClasses[j] : (j > 0 ? 'num' : '')}>
                          {j === 0
                            ? <strong style={{ color: 'var(--w90)' }}>{c}</strong>
                            : Array.isArray(c)
                              ? <a href={c[1]} target="_blank" rel="noopener noreferrer" style={{ color: 'var(--teal)' }}>{c[0]}</a>
                              : c}
                        </td>
                      ))}</tr>
                    ))}
                  </tbody>
                </table>
              </div>
              {data.note && <div className={`hl animate d3${data.dense ? ' dense' : ''}`} style={{ marginTop: data.dense ? 12 : 20, marginBottom: 12, maxWidth: 860 }}>{data.note}</div>}
            </>
          );

          case 'bars': return (
            <>
              <Eyebrow n={n} label={data.eyebrow} />
              <div className="g2" style={{ gap: 48, alignItems: 'center' }}>
                <div className="animate d2">
                  {data.bars.map(([label, val]) => (
                    <Bar key={label} label={label} val={val} active={active} />
                  ))}
                </div>
                <div>
                  <Title title={data.title} accent={data.titleAccent} />
                  <p className="subline animate d3">{data.text}</p>

              </div>

          case 'roadmap': return (
            <>
              <Eyebrow n={n} label={data.eyebrow} />
              <Title title={data.title} accent={data.titleAccent} />
              <div className="animate d2" style={{ maxWidth: 780, marginTop: 8 }}>
                {data.items.map(([t, d], i) => (
                  <div key={i} className="roadmap-item">
                    <div className="roadmap-dot" />
                    <div><div className="roadmap-title">{t}</div><div className="roadmap-desc">{d}</div></div>
                  </div>
                ))}
              </div>
            </>
          );

          case 'quote': return (
            <div style={{ textAlign: 'center', margin: '0 auto' }}>
              <Eyebrow n={n} label={data.eyebrow} />
              <h2 className="headline animate d1" style={{ textAlign: 'center', margin: '0 auto 22px', maxWidth: 880 }}>
                {data.title}<br /><span className="accent">{data.titleAccent}</span>
              </h2>
              <p className="subline animate d2" style={{ margin: '0 auto', maxWidth: 720, textAlign: 'center' }}>{data.text}</p>

          case 'closing': return (
            <div style={{ textAlign: 'center', margin: '0 auto' }}>

                {data.title}<br /><span className="accent">{data.titleAccent}</span>

              <a href={data.repoUrl} target="_blank" rel="noopener noreferrer" className="animate d3"
                 style={{ fontFamily: 'var(--mono)', fontSize: '.78rem', color: 'var(--teal)', letterSpacing: '.04em', textDecoration: 'none', border: '1px solid var(--border)', padding: '10px 20px', borderRadius: 999, display: 'inline-block' }}>
                ↗ {data.repoLabel}
              </a>
            </div>
          );

          default: return null;
        }
      })();

      return (
        <div className={cls} id={data.id}>
          <div className="slide-content">
            {body}
          </div>
        </div>
      );
    }

    /* ═══════════════════════ SHORTCUTS MODAL ═══════════════════════ */
    function ShortcutsModal({ onClose }) {
      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>{UI.shortcutsTitle}</h3>
            {UI.shortcutsList.map(([k, d]) => (
              <div key={k} className="modal-row"><span>{d}</span><kbd>{k}</kbd></div>
            ))}
            <button className="modal-close" onClick={onClose}>{UI.close}</button>
          </div>
        </div>
      );
    }

    /* ═══════════════════════ APP ═══════════════════════ */
    function App() {
      const [cur, setCur] = useState(0);
      const [theme, setTheme] = useState('dark');
      const [showShortcuts, setShowShortcuts] = useState(false);
      const [lang, setLang] = useState('pt');
      const [muted, setMuted] = useState(true);
      const touchStart = useRef(null);
      const isAnimating = useRef(false);
      const audioRef = useRef(null);

      /* Swap the active language data before this render's children read UI / SLIDES */
      UI = lang === 'pt' ? UI_PT : UI_EN;
      SLIDES = lang === 'pt' ? SLIDES_PT : SLIDES_EN;

      useEffect(() => {
        document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
        document.title = lang === 'pt'
          ? 'Helipad Detector — Apresentação Executiva'
          : 'Helipad Detector — Executive Presentation';
      }, [lang]);

      useEffect(() => {
        if (audioRef.current) audioRef.current.volume = 0.35;
      }, []);

      /* Browsers block real "autoplay with sound" — there is no way around
         that. The closest equivalent, and what actually solves "people
         don't notice the music option": start playback automatically on
         the very first click / key press / tap anywhere in the deck
         (which happens the moment someone advances a slide), instead of
         requiring them to find and click the small 🔇 icon first. */
      const autoStarted = useRef(false);
      useEffect(() => {
        const startOnce = () => {
          if (autoStarted.current) return;
          autoStarted.current = true;
          const audio = audioRef.current;
          if (audio) {
            audio.muted = false;
            audio.play().then(() => setMuted(false)).catch(() => {});
          }
        };
        window.addEventListener('click', startOnce, { once: true });
        window.addEventListener('keydown', startOnce, { once: true });
        window.addEventListener('touchstart', startOnce, { once: true });
        return () => {
          window.removeEventListener('click', startOnce);
          window.removeEventListener('keydown', startOnce);
          window.removeEventListener('touchstart', startOnce);
        };
      }, []);

      const toggleSound = () => {
        autoStarted.current = true; // a manual click always wins over the auto-start listener
        const audio = audioRef.current;
        if (!audio) return;
        if (muted) {
          audio.muted = false;
          audio.play().catch(() => {});
        } else {
          audio.muted = true;
        }
        setMuted(m => !m);
      };

      const go = useCallback((idx) => {
        if (isAnimating.current || idx === cur || idx < 0 || idx >= SLIDES.length) return;
        isAnimating.current = true;
        setCur(idx);
        setTimeout(() => { isAnimating.current = false }, 600);
      }, [cur]);

      useEffect(() => {
        const h = (e) => {
          if (showShortcuts) { if (e.key === 'Escape' || e.key === '?') setShowShortcuts(false); return; }
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(cur + 1);
          else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') go(cur - 1);
          else if (e.key === 'f' || e.key === 'F') {
            document.fullscreenElement ? document.exitFullscreen() : document.getElementById('stage').requestFullscreen();
          }
          else if (e.key === 'r' || e.key === 'R') go(0);
          else if (e.key === '?') setShowShortcuts(true);
          else if (e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen();
        };
        window.addEventListener('keydown', h);
        return () => window.removeEventListener('keydown', h);
      }, [cur, go, showShortcuts]);

      useEffect(() => {
        const s = (e) => { touchStart.current = e.touches[0].clientX };
        const en = (e) => {
          if (!touchStart.current) return;
          const dx = touchStart.current - e.changedTouches[0].clientX;
          if (Math.abs(dx) > 50) { dx > 0 ? go(cur + 1) : go(cur - 1); }
          touchStart.current = null;
        };
        window.addEventListener('touchstart', s, { passive: true });
        window.addEventListener('touchend', en, { passive: true });
        return () => { window.removeEventListener('touchstart', s); window.removeEventListener('touchend', en) };
      }, [cur, go]);

      useEffect(() => { document.body.setAttribute('data-theme', theme) }, [theme]);

      const toggleFullscreen = () => {
        document.fullscreenElement ? document.exitFullscreen() : document.getElementById('stage').requestFullscreen();
      };

      const exitPresentation = () => {
        if (window.confirm(UI.exitConfirm)) {
          if (document.fullscreenElement) document.exitFullscreen();
          go(0);
        }
      };

      const onScrub = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        go(Math.min(SLIDES.length - 1, Math.max(0, Math.round(pct * (SLIDES.length - 1)))));
      };

      const pct = (cur / (SLIDES.length - 1)) * 100;

      return (
        <>
          <div className="heli-ambient" aria-hidden="true">
            <DroneSVG />
          </div>

          <audio ref={audioRef} src={AUDIO_SRC} loop preload="auto" muted />

          <div className="timeline-track" onClick={onScrub} title={lang === 'pt' ? 'Arraste / clique para pular para uma seção' : 'Drag / click to jump to a section'}>
            <div className="timeline-fill" style={{ width: `${pct}%` }} />
          </div>

          <div className="slide-counter">
            <span>{String(cur + 1).padStart(2, '0')}</span> / {String(SLIDES.length).padStart(2, '0')}
            &emsp;<span style={{ color: 'var(--w50)', fontSize: '.65rem' }}>{SLIDES[cur].label}</span>
          </div>

          <div
            className="lang-switch"
            onClick={() => setLang(l => l === 'pt' ? 'en' : 'pt')}
            title={lang === 'pt' ? 'Switch to English' : 'Mudar para Português'}
          >
            <span className={`lang-opt ${lang === 'pt' ? 'active' : ''}`}>🇧🇷 PT</span>
            <span className={`lang-opt ${lang === 'en' ? 'active' : ''}`}>🇬🇧 EN</span>
          </div>

          {SLIDES.map((s, i) => {
            let cls = 'slide';
            if (s.type === 'mermaidpipeline') cls += ' slide-top-align';
            if (i === cur) cls += ' active';
            else if (i < cur) cls += ' exit-up';
            else cls += ' exit-down';
            return <Slide key={s.id} data={s} n={i + 1} className={cls} active={i === cur} />;
          })}

          <div className="hud">
            <ProgressRing cur={cur} total={SLIDES.length} onJump={go} />
            <div className="hud-sep" />
            <button className="hud-btn" onClick={() => go(cur - 1)} title={UI.prev} disabled={cur === 0}>◀</button>
            <button className="hud-btn" onClick={() => go(cur + 1)} title={UI.next} disabled={cur === SLIDES.length - 1}>▶</button>
            <button className="hud-btn" onClick={() => go(0)} title={UI.restart}>↺</button>
            <button className="hud-btn" onClick={toggleFullscreen} title={UI.fullscreen}>⛶</button>
            <button className="hud-btn" onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} title={UI.theme}>
              {theme === 'dark' ? '☀' : '🌙'}
            </button>
            <div className="hud-sep" />
            <button className="hud-btn" onClick={toggleSound} title={muted ? (lang === 'pt' ? 'Ativar música' : 'Enable music') : (lang === 'pt' ? 'Silenciar música' : 'Mute music')}>
              {muted ? '🔇' : '🔊'}
            </button>
            <div className="hud-sep" />
            <button className="hud-btn" onClick={() => setShowShortcuts(true)} title={UI.shortcuts}>?</button>
            <button className="hud-btn danger" onClick={exitPresentation} title={UI.exit}>⏻</button>
            <button id="pptx-btn" className="hud-btn" onClick={exportPPT} title={lang === 'pt' ? 'Baixar PPTX' : 'Download PPTX'} style={{ fontWeight: 600, color: 'var(--teal)' }}>{UI.pptx}</button>
          </div>

          <div className="grain-overlay" aria-hidden="true" />
          <div className="vignette-overlay" aria-hidden="true" />

          {showShortcuts && <ShortcutsModal onClose={() => setShowShortcuts(false)} />}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('stage')).render(<App />);

    async function exportPPT() {
      const btn = document.getElementById('pptx-btn');
      if (btn) btn.textContent = '⏳';
      document.querySelectorAll('.animate').forEach(el => {
        el.style.animation = 'none'; el.style.opacity = '1'; el.style.transform = 'none';
      });
      const pptx = new PptxGenJS();
      pptx.layout = 'LAYOUT_16x9';
      const all = [...document.querySelectorAll('.slide')];
      const hud = document.querySelector('.hud');
      const ctr = document.querySelector('.slide-counter');
      const tl = document.querySelector('.timeline-track');
      if (hud) hud.style.opacity = '0';
      if (ctr) ctr.style.opacity = '0';
      if (tl) tl.style.opacity = '0';
      for (let i = 0; i < all.length; i++) {
        const el = all[i];
        const origCls = el.className;
        el.className = 'slide active';
        const canvas = await html2canvas(el, {
          width: 1920, height: 1080, scale: 1,
          backgroundColor: document.body.getAttribute('data-theme') === 'dark' ? '#050506' : '#f5f5f7',
          windowWidth: 1920, windowHeight: 1080, logging: false,
        });
        el.className = origCls;
        const s = pptx.addSlide();
        s.background = { color: document.body.getAttribute('data-theme') === 'dark' ? '050506' : 'f5f5f7' };
        s.addImage({ data: canvas.toDataURL('image/png', .95), x: 0, y: 0, w: '100%', h: '100%' });
      }
      if (hud) hud.style.opacity = '1';
      if (ctr) ctr.style.opacity = '1';
      if (tl) tl.style.opacity = '1';
      pptx.writeFile({ fileName: UI.pptxFile });
      if (btn) btn.textContent = UI.pptx;
    }
  </script>
</body>

</html>
